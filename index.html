<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Birinchi Ish</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</head>

<body>
  <div id="prog"></div>

  <header id="nav">
    <a class="logo" href="#top">
      <img src="assets/logo.svg" alt="" width="34" height="34">
      Birinchi<b>Ish</b>
    </a>

    <nav id="menu">
      <a href="#how" data-i18n="nav_how"></a>
      <a href="#demo" data-i18n="nav_demo"></a>
      <a href="#plans" data-i18n="nav_plans"></a>
    </nav>

    <div class="act">
      <select id="lang" aria-label="Language">
        <option value="uz">UZ</option>
        <option value="ru">RU</option>
        <option value="en">EN</option>
      </select>

      <span id="guest">
        <button class="btn g sm" data-auth="login" data-i18n="login"></button>
        <button class="btn sm" data-auth="signup" data-i18n="signup"></button>
      </span>

      <span id="user" hidden>
        <b id="uname"></b>
        <button class="btn g sm" id="out" data-i18n="logout"></button>
      </span>

      <button id="burger" aria-label="Menu">
        <i></i>
        <i></i>
      </button>
    </div>
  </header>

  <main id="top">

    <section class="hero">
      <div class="blob b1"></div>
      <div class="blob b2"></div>

      <div class="hl">
        <p class="tag" data-i18n="tag"></p>
        <h1>
          <span data-i18n="h1a"></span><br>
          <em data-i18n="h1b"></em><br>
          <span data-i18n="h1c"></span>
        </h1>
        <p class="lead" data-i18n="hero_p"></p>
        <div class="row">
          <a class="btn" href="#demo" data-i18n="cta1"></a>
          <button class="btn g" data-auth="signup" data-i18n="cta2"></button>
        </div>
      </div>

      <div class="hr" aria-hidden="true">
        <div class="fc c1">
          <i class="av">A</i>
          <div>
            <b>Aziza, 20</b>
            <small>Python · JS</small>
          </div>
        </div>
        <div class="fc c2">
          <div class="ring">92%</div>
          <small>Match</small>
        </div>
        <div class="fc c3">
          <div>
            <b>Junior Dev</b>
            <small>Tashkent · Remote</small>
          </div>
          <span class="pill">NEW</span>
        </div>
      </div>
    </section>

    <section class="stats">
      <div class="rv">
        <b data-n="5000">0</b>
        <span data-i18n="st1"></span>
      </div>
      <div class="rv" style="--d:1">
        <b data-n="300">0</b>
        <span data-i18n="st2"></span>
      </div>
      <div class="rv" style="--d:2">
        <b data-n="92" data-s="%">0</b>
        <span data-i18n="st3"></span>
      </div>
    </section>

    <section id="how">
      <h2 class="rv" data-i18n="how_t"></h2>
      <div class="g3">
        <div class="card rv">
          <div class="n">1</div>
          <h3 data-i18n="s1t"></h3>
          <p data-i18n="s1p"></p>
        </div>
        <div class="card rv" style="--d:1">
          <div class="n">2</div>
          <h3 data-i18n="s2t"></h3>
          <p data-i18n="s2p"></p>
        </div>
        <div class="card rv" style="--d:2">
          <div class="n">3</div>
          <h3 data-i18n="s3t"></h3>
          <p data-i18n="s3p"></p>
        </div>
      </div>
    </section>

    <section id="demo">
      <h2 class="rv" data-i18n="demo_t"></h2>
      <div class="demo rv">
        <label class="note" data-i18n="demo_pick"></label>
        <div class="chips" id="chips"></div>
        <div class="jobs" id="jobs"></div>
        <p class="note" style="margin-top:16px" data-i18n="demo_note"></p>
      </div>
    </section>

    <section id="plans">
      <h2 class="rv" data-i18n="plans_t"></h2>
      <div class="g3">
        <div class="card rv">
          <h3 data-i18n="pl1"></h3>
          <div class="price" data-i18n="pl1p"></div>
          <p data-i18n="pl1d"></p>
        </div>
        <div class="card hot rv" style="--d:1">
          <h3 data-i18n="pl2"></h3>
          <div class="price" data-i18n="pl2p"></div>
          <p data-i18n="pl2d"></p>
        </div>
        <div class="card rv" style="--d:2">
          <h3 data-i18n="pl3"></h3>
          <div class="price" data-i18n="pl3p"></div>
          <p data-i18n="pl3d"></p>
        </div>
      </div>
    </section>

    <section class="cta">
      <h2 class="rv" data-i18n="join_t"></h2>
      <button class="btn rv" data-auth="signup" data-i18n="cta2"></button>
    </section>

  </main>

  <footer data-i18n="foot"></footer>

  <div id="modal" hidden>
    <div class="box">
      <button class="x" id="mx" aria-label="Close">×</button>

      <div class="tabs">
        <button data-tab="login" data-i18n="login"></button>
        <button data-tab="signup" data-i18n="signup"></button>
      </div>

      <button class="btn g wide" id="gbtn">
        <b class="gl">G</b>
        <span data-i18n="a_google"></span>
      </button>

      <p class="or" data-i18n="a_or"></p>

      <form id="af" novalidate>
        <input id="fn" data-i18n-ph="a_name" autocomplete="name">
        <input id="fe" type="email" data-i18n-ph="a_email" autocomplete="email">
        <input id="fp" type="password" data-i18n-ph="a_pass" autocomplete="current-password">
        <p id="err" role="alert"></p>
        <button class="btn wide" id="sub"></button>
      </form>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
